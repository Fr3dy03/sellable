name: Mainnet readiness
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sellable
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sellable_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run contracts:compile
      - run: npm run web:build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run migrate && npm run migrate && npm run test:integration
        env:
          CHAIN_ENV: mainnet
          DB_URL: postgres://sellable:test-only@localhost:5432/sellable_test
          TEST_DB_URL: postgres://sellable:test-only@localhost:5432/sellable_test
